<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zunio | Create Account</title>

    <link rel="stylesheet" href="../css/signup.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<body>
    <main class="signup-page">
        <div class="background-shape shape-one"></div>
        <div class="background-shape shape-two"></div>

        <section class="signup-card">
            <a href="../index.html" class="brand">
                <span class="brand-icon">Z</span>
                <span>Zunio</span>
            </a>

            <div class="signup-heading">
                <span class="eyebrow">START YOUR JOURNEY</span>
                <h1>Create Account</h1>
                <p>Join Zunio and get started today.</p>
            </div>

            <form id="signupForm">
                <div class="input-group">
                    <label for="signupName">Full Name</label>
                    <div class="input-wrap">
                        <span class="input-icon">♙</span>
                        <input
                            type="text"
                            id="signupName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="signupEmail">Email Address</label>
                    <div class="input-wrap">
                        <span class="input-icon">✉</span>
                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="signupPassword">Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">♙</span>
                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            data-target="signupPassword"
                            aria-label="Show password"
                        >Show</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">♙</span>
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Enter password again"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                            aria-label="Show confirm password"
                        >Show</button>
                    </div>
                </div>

                <label class="terms">
                    <input type="checkbox" id="terms" required>
                    <span>I agree to the Terms &amp; Conditions.</span>
                </label>

                <p id="signupMessage" class="message" role="status" aria-live="polite"></p>

                <button type="submit" id="signupButton" class="signup-btn">
                    <span id="buttonText">Create Account</span>
                    <span aria-hidden="true">→</span>
                </button>
            </form>

            <div class="login-link">
                Already have an account?
                <a href="login.html">Log In</a>
            </div>

            <p class="footer-note">© 2026 Zunio. All rights reserved.</p>
        </section>
    </main>

    <script type="module" src="../JS/signup.js"></script>
</body>
</html>
