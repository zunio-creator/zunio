
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zunio | Login</title>

    <link rel="stylesheet" href="../css/login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>
<body>

    <main class="login-page">
        <div class="background-shape shape-one"></div>
        <div class="background-shape shape-two"></div>

        <section class="login-card">

            <a href="../index.html" class="brand">
                <span class="brand-icon">Z</span>
                <span>Zunio</span>
            </a>

            <div class="login-heading">
                <span class="eyebrow">WELCOME BACK</span>
                <h1>Log In</h1>
                <p>Sign in to continue your journey with Zunio.</p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <label for="loginEmail">Email Address</label>

                    <div class="input-wrap">
                        <span class="input-icon">✉</span>
                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="loginPassword">Password</label>

                    <div class="input-wrap">
                        <span class="input-icon">♙</span>
                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            class="password-toggle"
                            data-target="loginPassword"
                            aria-label="Show password"
                        >Show</button>
                    </div>
                </div>

                <div class="form-options">
                    <span></span>
                    <button type="button" id="forgotPassword">
                        Forgot Password?
                    </button>
                </div>

                <p id="loginMessage" class="message"
                   role="status" aria-live="polite"></p>

                <button type="submit" id="loginButton" class="login-btn">
                    <span id="buttonText">Log In</span>
                    <span aria-hidden="true">→</span>
                </button>

            </form>

            <div class="signup-link">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </div>

            <p class="footer-note">
                © 2026 Zunio. All rights reserved.
            </p>

        </section>
    </main>

    <script type="module" src="../JS/login.js"></script>
</body>
</html>
